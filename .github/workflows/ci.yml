name: CI

# Qualité du code sur chaque pull request et chaque push sur main : lint, types,
# tests avec seuils de couverture, build de production. Les scans de sécurité
# (Trivy, Gitleaks, ZAP) sont dans security.yml et zap-*.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node (version de .nvmrc, cache npm)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Sans rapport d'audit : l'endpoint npm est lent, Trivy couvre les CVE en CI.
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests et couverture (seuils 80 %)
        run: npm run test:coverage

      # Sans VITE_MAILER_URL : le build vérifie que le site compile, le formulaire
      # bascule sur le repli email. L'URL de production vit dans .docker/Dockerfile.
      - name: Build
        run: npm run build
