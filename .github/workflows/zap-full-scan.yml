name: OWASP ZAP Full Scan

# Scan DAST ACTIF hebdomadaire : ZAP envoie de vraies attaques (injections, XSS, ...)
# sur l'app buildée localement dans le runner. Long (jusqu'à ~45 min), donc jamais
# lancé sur les PR. Le rapport HTML/JSON/MD est publié en artifact du run.
#
# Le schedule ne se déclenche que sur la branche par défaut (main) : ce workflow
# devient actif une fois la branche mergée. `workflow_dispatch` permet de le
# lancer à la main depuis l'onglet Actions.
on:
  schedule:
    # Tous les lundis à 8h00 UTC (heure du runner GitHub Actions, pas l'heure locale),
    # soit 10h à Paris en été et 9h en hiver.
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Un seul full scan à la fois, sans annuler un scan en cours.
concurrency:
  group: zap-full-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  zap-full-scan:
    uses: Skuskusku13/workflows-reusable/.github/workflows/owasp-zap-full-scan.yml@v1.2.1
    with:
      project-name: portfolio
      node-version: '22'
      install-command: npm ci --no-audit --no-fund
      build-command: npm run build
      start-command: npm run preview -- --port 4173 --host
      port: '4173'
      health-check-path: /
      zap-spider-minutes: '3'
      # Spider navigateur : indispensable pour une SPA React, le spider classique
      # ne voit que le index.html vide.
      zap-ajax-spider: true
      zap-active-scan-minutes: '30'
      zap-fail-on-warn: false
      job-timeout-minutes: 60
