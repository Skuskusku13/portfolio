name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Tous les 1er du mois à 8h00 UTC (heure du runner GitHub Actions, pas l'heure locale)
    - cron: '0 8 1 * *'

# Annule le run précédent sur la même branche/PR (évite d'empiler les scans)
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Trivy (dépendances, via package-lock.json) + Gitleaks (secrets).
# npm audit retiré en v1.2.1 : l'endpoint npm ne répondait pas depuis les runners,
# et Trivy couvre les mêmes avis (GitHub Advisory Database).
jobs:
  security:
    uses: Skuskusku13/workflows-reusable/.github/workflows/npm-security.yml@3ec7f78b10aa9eae037d337681719f50b9e26a6c # v1.2.1
    with:
      project-name: portfolio
      # Node 26 partout (.nvmrc, Dockerfile, zap-*.yml). Input DÉPRÉCIÉ côté
      # workflows-reusable depuis v1.2.1 (npm audit retiré) : ignoré aujourd'hui,
      # supprimé en v2.0.0 — à retirer d'ici lors du bump de version majeure.
      node-version: '26'
