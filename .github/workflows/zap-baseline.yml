name: OWASP ZAP Baseline

# Scan DAST passif (aucune attaque) sur l'app buildée dans le runner. Rapide,
# lancé sur chaque PR. Le scan actif complet est dans zap-full-scan.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Tous les 1er du mois à 8h00 UTC (heure du runner GitHub Actions, pas l'heure locale)
    - cron: '0 8 1 * *'

concurrency:
  group: zap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    uses: Skuskusku13/workflows-reusable/.github/workflows/owasp-zap-baseline.yml@3ec7f78b10aa9eae037d337681719f50b9e26a6c # v1.2.1
    with:
      project-name: portfolio
      node-version: '26'
      install-command: npm ci --no-audit --no-fund
      build-command: npm run build
      start-command: npm run preview -- --port 4173 --host
      port: '4173'
      health-check-path: /
      zap-spider-minutes: '1'
      zap-fail-on-warn: false
