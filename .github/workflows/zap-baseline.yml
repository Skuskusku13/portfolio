name: OWASP ZAP Baseline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Tous les 1er du mois à 8h00 UTC (heure du runner GitHub Actions, pas l'heure locale)
    - cron: '0 8 1 * *'

jobs:
  zap-baseline:
    uses: Skuskusku13/workflows-reusable/.github/workflows/owasp-zap-baseline.yml@v1.1.1
    with:
      project-name: portfolio
      node-version: '22'
      build-command: npm run build
      start-command: npm run preview -- --port 4173 --host
      port: '4173'
      health-check-path: /
      zap-fail-on-warn: false
