networks:
  nginx:
    external: true

services:

  portfolio:
    build:
      context: ../
      dockerfile: ./.docker/Dockerfile
      args:
        # URL publique de l'API de contact, inlinée dans le bundle par Vite (valeur publique, pas un secret).
        # Défaut = prod ; surchargeable via un .env à côté de ce fichier (VITE_MAILER_URL=...).
        VITE_MAILER_URL: ${VITE_MAILER_URL:-https://back.dlyhub.com/send-email}
    container_name: "portfolio"
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: dlyhub.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: dlyhub.com
      LETSENCRYPT_EMAIL: ${DEFAULT_EMAIL}
    networks:
      - nginx