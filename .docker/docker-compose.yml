networks:
  nginx:
    external: true

services:

  portfolio:
    # Image publiée sur GHCR par .github/workflows/image.yml à chaque release.
    # PORTFOLIO_TAG (ex. 1.0.0) choisit la version déployée ; sans valeur, latest.
    # `build:` reste là pour un build local de secours (make build), tagué du même nom.
    image: ghcr.io/skuskusku13/portfolio:${PORTFOLIO_TAG:-latest}
    build:
      context: ../
      dockerfile: ./.docker/Dockerfile
      args:
        # URL publique de l'API de contact, inlinée dans le bundle par Vite (valeur publique, pas un secret).
        # Défaut = prod ; surchargeable via un .env à côté de ce fichier (VITE_MAILER_URL=...).
        VITE_MAILER_URL: ${VITE_MAILER_URL:-https://back.dlyhub.com/api/contact}
    container_name: "portfolio"
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: dlyhub.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: dlyhub.com
      LETSENCRYPT_EMAIL: ${DEFAULT_EMAIL}
    networks:
      - nginx