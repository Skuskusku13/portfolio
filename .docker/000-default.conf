# --- Durcissement serveur (contexte global, ce fichier est inclus en fin de httpd.conf) ---
# Ne pas révéler la version d'Apache (en-tête Server, pages d'erreur)
ServerTokens Prod
ServerSignature Off
# Méthode TRACE désactivée (activée par défaut dans Apache 2.4)
TraceEnable Off

<VirtualHost *:80>
    ServerName dlyhub.com
    DocumentRoot /usr/local/apache2/htdocs

    # --- Headers de sécurité (mod_headers) ---
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"

    # clipboard-write non restreint (utilisé par Contact.tsx)
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(), picture-in-picture=()"

    # OK tant qu'aucune ressource cross-origin n'est embarquée (fonts, embeds...)
    Header always set Cross-Origin-Embedder-Policy "require-corp"

    # Isolation cross-origin (rapport ZAP full scan du 2026-09-05) :
    # - COOP : la page ne partage pas son browsing context avec une fenêtre d'une autre origine
    # - CORP : les ressources (images, fonts, JS) ne sont chargeables que depuis dlyhub.com.
    #   Passer en "cross-origin" si une image doit être hot-linkée depuis un autre site.
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    # Referer : origine seule vers les autres sites, URL complète en same-origin (défaut moderne des navigateurs)
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # script-src : hashes des deux scripts inline d'index.html — JSON-LD (nzh1x…) et script d'initialisation du thème (9gu9…) — à recalculer si leur contenu change
    # connect-src : API de contact publique (portfolio-back, VITE_MAILER_URL=https://back.dlyhub.com/api/contact)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-nzh1x/ZzYDsWASHoBO2qZf4aj3uq1UOad1PdTXx3qgA=' 'sha256-9gu9bbWJzuA+Dl3BSmO0WTseNR/HvFlpQEkYS2LPgz0='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://back.dlyhub.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

    # Configuration du dossier racine
    <Directory /usr/local/apache2/htdocs/>
        # Liste absolue (pas de +/-) : remplace le "Indexes FollowSymLinks" hérité de httpd.conf.
        # SymLinksIfOwnerMatch suffit à mod_rewrite et refuse les liens vers des fichiers d'un autre propriétaire
        Options SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
        DirectoryIndex index.html

        # Site statique : seules les lectures sont servies ici (le formulaire poste vers l'API externe)
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>

        # Aucun fichier caché n'est servi (.htaccess, .git, .env…), même s'il arrivait dans l'image
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>

        # Cache pour les fichiers racines (HTML, robots, sitemap, manifest)
        <FilesMatch "\.(html|txt|xml|webmanifest)$">
            Header set Cache-Control "max-age=0, no-cache, no-store, must-revalidate"
        </FilesMatch>

        # Favicons : pas de nom hashé, donc pas d'immutable possible
        <FilesMatch "\.(ico|png|svg)$">
            Header set Cache-Control "max-age=86400, public"
        </FilesMatch>

        # Polices auto-hébergées (/fonts/*.woff2) : nom stable, cache 30 jours
        <FilesMatch "\.woff2$">
            Header set Cache-Control "max-age=2592000, public"
        </FilesMatch>

        # Activation du routing côté client pour les SPA
        RewriteEngine On
        RewriteBase /
        
        # Ne pas réécrire si le fichier ou le dossier existe réellement
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Réécrire tout le reste vers index.html
        RewriteRule ^ index.html [L]
    </Directory>

    # Configuration spécifique pour les assets (Cache 1 an)
    # Ce bloc doit être séparé du bloc racine
    <Directory "/usr/local/apache2/htdocs/assets">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </Directory>

</VirtualHost>