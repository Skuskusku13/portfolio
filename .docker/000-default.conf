<VirtualHost *:80>
    ServerName dlyhub.com
    DocumentRoot /usr/local/apache2/htdocs

    # --- Headers de sécurité (mod_headers) ---
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"

    # clipboard-write non restreint (utilisé par Contact.tsx)
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(), picture-in-picture=()"

    # OK tant qu'aucune ressource cross-origin n'est embarquée (fonts, embeds...)
    Header always set Cross-Origin-Embedder-Policy "require-corp"

    # script-src : hash du <script type="application/ld+json"> (JSON-LD) — à recalculer si son contenu change
    # connect-src : API de contact publique (portfolio-back, VITE_MAILER_URL=https://back.dlyhub.com/send-email)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-nzh1x/ZzYDsWASHoBO2qZf4aj3uq1UOad1PdTXx3qgA='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://back.dlyhub.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

    # Configuration du dossier racine
    <Directory /usr/local/apache2/htdocs/>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html

        # Cache pour les fichiers racines (HTML, robots, sitemap, manifest)
        <FilesMatch "\.(html|txt|xml|webmanifest)$">
            Header set Cache-Control "max-age=0, no-cache, no-store, must-revalidate"
        </FilesMatch>

        # Favicons : pas de nom hashé, donc pas d'immutable possible
        <FilesMatch "\.(ico|png|svg)$">
            Header set Cache-Control "max-age=86400, public"
        </FilesMatch>

        # Activation du routing côté client pour les SPA
        RewriteEngine On
        RewriteBase /
        
        # Ne pas réécrire si le fichier ou le dossier existe réellement
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Réécrire tout le reste vers index.html
        RewriteRule ^ index.html [L]
    </Directory>

    # Configuration spécifique pour les assets (Cache 1 an)
    # Ce bloc doit être séparé du bloc racine
    <Directory "/usr/local/apache2/htdocs/assets">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </Directory>

</VirtualHost>